name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run again on demand, to measure how unstable the tests are (scripts/ci-flakes.mjs reads the runs).
  workflow_dispatch:

concurrency:
  # A run started by hand has a group of its own: neither a push nor another run replaces it.
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # Escouade K is built and released for macOS only: the Windows and Linux jobs are gone.
  macos:
    name: macOS (lint, tests and app bundle)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain (pinned in src-tauri/rust-toolchain.toml)
        working-directory: src-tauri
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (svelte-check)
        run: npm run check

      - name: Frontend tests (Vitest)
        run: npm test

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # One process per test (src-tauri/.config/nextest.toml): a test that hangs is killed after
      # 3 minutes and named, one that fails runs again twice. Reading the job's log takes admin
      # rights: the failures, and the tests that passed at a new try, are also annotations.
      # The runner has 3 vCPUs.
      - name: Rust tests (unit + integration with the fake claude CLI)
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          cargo nextest run --profile ci --test-threads 3 2>&1 | tee nextest.log
          status=${PIPESTATUS[0]}
          node ../scripts/nextest-annotations.mjs nextest.log target/nextest/ci/junit.xml $status
          exit $status

      # Without the updater key: only checks that the app and its disk image build.
      - name: Build the app bundle
        run: npx tauri build --debug --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload the disk image
        uses: actions/upload-artifact@v7
        with:
          name: escouade-macos-debug
          path: src-tauri/target/debug/bundle/dmg/*.dmg
          retention-days: 7
