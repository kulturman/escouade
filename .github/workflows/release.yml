name: Release

# A tag `vX.Y.Z` (pushed, or created with a release on GitHub's page) publishes a release: NSIS
# installer (Windows), universal app and disk image (macOS), AppImage and .deb (Linux), signed
# updater artifacts and the latest.json of the in-app updater, which holds the three systems. The app gets the tag's version.
# The release is a draft while the three builds upload to it (~30 min, each one rewriting
# latest.json), and the last job publishes it once latest.json and every file it names are in:
# the in-app updater reads the latest release, so it never meets a half-built one. A failed build
# just leaves the draft, and the previous release stays the latest.
# It only builds: the tests run on each push to main (ci.yml), and a tag is put on a commit whose
# CI is green.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create:
    name: Create the release
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      # Sets it in this checkout only: fails unless the tag is a version.
      - name: Check that the tag is a version
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/version.mjs "$TAG"

      # Created before the long builds, while the tag is still the head of main: once main has
      # moved past it, GITHUB_TOKEN may no longer create the release ("Resource not accessible by
      # integration", it would need the `workflows` permission it cannot have). It is a draft, and
      # the builds and the last job find it by its id: the by-tag lookups do not see a draft. A
      # release that already exists for the tag (made on GitHub's page, or a run started again)
      # goes back to draft; the API lists drafts too, `gh release view` does not.
      - name: Create the release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          release_id() {
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq 'map(select(.tag_name == env.TAG)) | first | .id // empty'
          }
          prerelease=false
          [[ "$TAG" == *-* ]] && prerelease=true
          id=$(release_id)
          if [ -n "$id" ]; then
            # A pre-release tag keeps its mark too, whatever the page of GitHub was ticked with.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=true -F prerelease=$prerelease > /dev/null
          else
            flags=()
            [ "$prerelease" = true ] && flags+=(--prerelease)
            # The version's section of CHANGELOG.md (a sentence pointing at the commits without one).
            node scripts/changelog.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" --verify-tag --draft --title "Escouade $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
            # The list may take a moment to show the new draft.
            for attempt in 1 2 3 4 5; do
              id=$(release_id)
              [ -n "$id" ] && break
              sleep 3
            done
          fi
          if [ -z "$id" ]; then
            echo "::error::No release found for $TAG, the builds have nowhere to upload"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build and upload (${{ matrix.name }})
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          # One app for Apple Silicon and Intel Macs.
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
          # The oldest Ubuntu GitHub still runs: the AppImage (which the in-app updater replaces)
          # and the .deb then start on the glibc of most distributions since 2022.
          - name: Linux
            os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain (pinned in src-tauri/rust-toolchain.toml)
        working-directory: src-tauri
        run: rustup toolchain install

      - name: Rust targets of the universal macOS app
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: System libraries of the Linux app (WebKitGTK, tray, AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # Even when main's version was not bumped (a release created on GitHub's page): v0.1.12 was
      # refused for that, its release stayed empty and the updater found no latest.json.
      - name: App version from the tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/version.mjs "$TAG"

      # No tests here: the tag's commit passed them on main (the CI workflow, on each push). Run
      # again on each system, an intermittent test sent whole releases back to draft (1.7.0, 1.7.4).

      # Optional: with an Apple Developer ID certificate in the repository secrets, the app is
      # signed and notarized (no Gatekeeper warning). Without it, it is signed ad hoc. Only set
      # when present: an empty APPLE_CERTIFICATE would make the build try to import it.
      - name: Apple signing (when configured)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              echo "::add-mask::${!v}"
              echo "$v=${!v}" >> "$GITHUB_ENV"
            fi
          done

      # The same notes go into latest.json, which the in-app updater reads.
      - name: Release notes
        id: notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo 'body<<ESCOUADE_NOTES_END'
            node scripts/changelog.mjs "$TAG"
            echo 'ESCOUADE_NOTES_END'
          } >> "$GITHUB_OUTPUT"

      # Uploads to the draft the create job made, by its id: tauri-action looks a release up by
      # tag (getReleaseByTag), which does not see a draft, and would make a second release. With
      # releaseId it creates and edits nothing, it only uploads the installers, their signatures
      # and latest.json. A job started again replaces its files of the same name: harmless.
      # tagName is still needed, it rewrites the `…/download/untagged-…/` links a draft gives in
      # latest.json to `…/download/<tag>/`; releaseBody is the notes of latest.json.
      - name: Build, sign and upload to the draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create.outputs.release-id }}
          tagName: ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Runs only when the three builds succeeded. The updater reads the latest release, so the draft
  # is published once its latest.json holds every system and each file it names is in: the three
  # builds each rewrite latest.json, and two at the same instant can lose one's system.
  publish:
    name: Publish the release once every system is in
    needs: [create, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check latest.json and the files it names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create.outputs.release-id }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" > "$RUNNER_TEMP/assets.json"
          asset=$(jq -r 'map(select(.name == "latest.json")) | first | .id // empty' "$RUNNER_TEMP/assets.json")
          if [ -z "$asset" ]; then
            echo "::error::The draft of $TAG has no latest.json"
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "$RUNNER_TEMP/latest.json"
          node scripts/release-check.mjs "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/assets.json" "$TAG"

      # By id, as the draft is not found by tag. A pre-release cannot be the latest release. If
      # GitHub refuses ("Resource not accessible by integration"), the draft is complete: publish
      # it by hand, `gh release edit <tag> --draft=false --latest`.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create.outputs.release-id }}
          TAG: ${{ github.ref_name }}
        run: |
          latest=true
          if [[ "$TAG" == *-* ]]; then latest=false; fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=$latest > /dev/null

      # What the in-app updater downloads: the latest release's, or the pre-release's own (it is
      # never the latest). GitHub's cache can take a moment to follow the publication.
      - name: Check what the updater reads
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/latest.json"
          else
            url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"
          fi
          expected="${TAG#v}"
          for attempt in 1 2 3 4 5 6; do
            version=$(curl -fsSL "$url" | jq -r '.version // empty') || version=
            if [ "$version" = "$expected" ]; then
              echo "$url says version $version"
              exit 0
            fi
            echo "Try $attempt of 6: $url says '${version}', expected '$expected'"
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          echo "::error::The updater would not read $TAG: $url does not say version $expected"
          exit 1
